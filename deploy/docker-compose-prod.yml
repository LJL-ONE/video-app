# ==========================================
# 视界视频社区 - Docker 一键部署
# 前端(Nginx) + 后端(Spring Boot) + 全部中间件
# ==========================================

services:
  # ---------- 前端 (Nginx) ----------
  frontend:
    image: nginx:alpine
    container_name: video-frontend
    ports:
      - "80:80"
    volumes:
      - ./video-front/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: always

  # ---------- 后端 (Spring Boot) ----------
  backend:
    image: eclipse-temurin:17-jdk-alpine
    container_name: video-backend
    ports:
      - "8081:8081"
    volumes:
      - ./video-project/target:/app
    working_dir: /app
    command: java -jar *.jar --spring.profiles.active=prod
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - minio
    restart: always

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: video-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: video_meeting
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - ./a/data/mysql:/var/lib/mysql
      - ./video-project/src/main/resources/db/video_meeting.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: video-redis
    ports:
      - "6379:6379"
    volumes:
      - ./a/data/redis:/data
    command: redis-server --appendonly yes
    restart: always

  # ---------- RabbitMQ ----------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: video-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./a/data/rabbitmq:/var/lib/rabbitmq
    restart: always

  # ---------- MinIO ----------
  minio:
    image: minio/minio:latest
    container_name: video-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./a/data/minio:/data
    command: server /data --address ":9000" --console-address ":9001"
    restart: always
