server {
    listen 80;
    # 匹配所有主机名；如需绑定域名，改为 your-domain.com
    server_name _;

    # 开启 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 前端静态文件（与 docker-compose-prod.yml 中 frontend 卷挂载路径一致）
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式 - 所有非 /api 请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite 构建的文件名含 hash）
    location ~* /assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理（Docker 网络中用服务名 backend 访问）
    # 注意：proxy_pass 不带末尾 /，保留 /api 前缀，与后端 context-path=/api 一致
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传大小限制（视频文件 200MB）
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
