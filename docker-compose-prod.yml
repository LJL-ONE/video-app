# ==========================================
# 视界视频社区 - Docker 一键部署
# 前端(Nginx) + 后端(Spring Boot) + 全部中间件
# 使用方法：docker compose -f docker-compose-prod.yml --env-file .env up -d
# ==========================================

services:
  # ---------- 前端 (Nginx) ----------
  frontend:
    image: ${IMAGE_REGISTRY_PREFIX}nginx:alpine
    container_name: video-frontend
    ports:
      - "80:80"
    volumes:
      - ./video-front/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    restart: always

  # ---------- 后端 (Spring Boot) ----------
  backend:
    image: ${IMAGE_REGISTRY_PREFIX}eclipse-temurin:17-jdk-alpine
    container_name: video-backend
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_meeting}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123456}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-video-meeting}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://127.0.0.1:9000/video-meeting}
      JWT_SECRET: ${JWT_SECRET:-video-meeting-server-secret-key-please-replace-in-production}
      JWT_EXPIRE: ${JWT_EXPIRE:-86400}
      SERVER_PORT: ${SERVER_PORT:-8081}
      TZ: Asia/Shanghai
    volumes:
      - ./video-project/target:/app
    working_dir: /app
    command: java -jar video-server-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: always

  # ---------- MySQL ----------
  mysql:
    image: ${IMAGE_REGISTRY_PREFIX}mysql:8.0
    container_name: video-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_meeting}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - ./a/data/mysql:/var/lib/mysql
      - ./video-project/src/main/resources/db/video_meeting.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Redis ----------
  redis:
    image: ${IMAGE_REGISTRY_PREFIX}redis:7-alpine
    container_name: video-redis
    ports:
      - "6379:6379"
    volumes:
      - ./a/data/redis:/data
    command: redis-server --appendonly yes
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- RabbitMQ ----------
  rabbitmq:
    image: ${IMAGE_REGISTRY_PREFIX}rabbitmq:3-management
    container_name: video-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - ./a/data/rabbitmq:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------- MinIO ----------
  minio:
    image: ${IMAGE_REGISTRY_PREFIX}minio/minio:latest
    container_name: video-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./a/data/minio:/data
    command: server /data --address ":9000" --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
