# ============================================
# 生产环境配置（Docker 容器内运行时使用）
# 通过 --spring.profiles.active=prod 激活
# 覆盖 application.yml，将各中间件 host 指向 docker compose 服务名
# ============================================
server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    # 容器内通过服务名 mysql 访问，端口为容器内部端口 3306
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:video_meeting}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# MinIO（容器内通过服务名访问，公开地址返回给前端需用外部可访问 IP）
minio:
  endpoint: http://minio:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:video-meeting}
  public-base-url: ${MINIO_PUBLIC_BASE_URL:http://127.0.0.1:9000/video-meeting}

# JWT
jwt:
  secret: ${JWT_SECRET:video-meeting-server-secret-key-please-replace-in-production}
  expire: ${JWT_EXPIRE:86400}

# 生产环境降低日志级别
logging:
  level:
    root: INFO
    com.video: INFO
