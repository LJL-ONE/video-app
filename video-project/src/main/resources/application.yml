server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: video-server
  # ============ 禁用 Nacos ============
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
        register-enabled: false
    bootstrap: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  # ============ 数据源 ============
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：mysql 端口冲突，docker mysql 用 3307
    url: jdbc:mysql://127.0.0.1:3307/${MYSQL_DATABASE:video_meeting}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
  # ============ Redis ============
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0
  # ============ RabbitMQ ============
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  # ============ Servlet 上传文件大小限制 ============
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

# ============ MyBatis-Plus ============
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.video.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============ MinIO ============
minio:
  endpoint: http://127.0.0.1:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:video-meeting}
  # 公开访问的前缀（用 nginx 反代或 MinIO 公开桶）
  public-base-url: ${MINIO_PUBLIC_BASE_URL:http://127.0.0.1:9000/video-meeting}

# ============ JWT（登录 token 校验）============
jwt:
  # 生产环境务必通过环境变量 JWT_SECRET 覆盖此默认值
  secret: ${JWT_SECRET:video-meeting-server-secret-key-please-replace-in-production}
  expire: ${JWT_EXPIRE:86400}   # 单位：秒，默认 24h
  header: Authorization
  prefix: "Bearer "

# ============ 日志 ============
logging:
  level:
    root: INFO
    com.video: DEBUG
    com.alibaba.nacos: WARN
  file:
    name: logs/video-server.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
