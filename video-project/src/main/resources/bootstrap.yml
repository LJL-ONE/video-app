spring:
  application:
    name: video-server
  # ============ Nacos 配置（可选）===========
  # 如果不需要 Nacos，将以下配置注释或删除即可
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      namespace:
      group: DEFAULT_GROUP
      config:
        file-extension: yaml
        refresh-enabled: true
      discovery:
        ephemeral: true
        group: DEFAULT_GROUP