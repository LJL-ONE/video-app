server:
  port: 8081
spring:
  application:
    name: video-server
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    druid:
      url: jdbc:mysql://127.0.0.1:3307/mysql?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8mb4&sslMode=DISABLED&allowPublicKeyRetrieval=true
      username: root
      password: root123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      connection-properties: allowPublicKeyRetrieval=true;allowLoadLocalInfile=FALSE
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin
    virtual-host: /
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms
minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minio123
  bucket-name: video-bucket
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.video.videoserver.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0